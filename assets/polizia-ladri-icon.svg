<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Polizia e Ladri</title>
  <desc id="desc">Uno scudo della polizia accanto a una maschera da ladro</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#162c59"/>
      <stop offset="1" stop-color="#0d1735"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d8bff"/>
      <stop offset="1" stop-color="#1d4fc2"/>
    </linearGradient>
    <linearGradient id="mask" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4b13d"/>
      <stop offset="1" stop-color="#e4772d"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bg)"/>
  <path d="M4 82h120v12c0 16.57-13.43 30-30 30H34C17.43 124 4 110.57 4 94V82Z" fill="#101b3d" opacity=".55"/>

  <!-- scudo della polizia -->
  <path d="M20 20h42v34c0 20-9.3 34.9-21 42-11.7-7.1-21-22-21-42V20Z" fill="url(#shield)" stroke="#dbeafe" stroke-width="3"/>
  <path d="M41 29l3.2 7.3 7.8.8-5.8 5.2 1.7 7.7-6.9-4-6.9 4 1.7-7.7-5.8-5.2 7.8-.8L41 29Z" fill="#ffe18a"/>
  <path d="M28 56h26" stroke="#dbeafe" stroke-width="3" stroke-linecap="round" opacity=".9"/>
  <path d="M32 65h18" stroke="#dbeafe" stroke-width="3" stroke-linecap="round" opacity=".72"/>

  <!-- maschera del ladro -->
  <path d="M66 43c7-11 32-11 39 0l9 5-6 10c-1 14-10 25-22.5 25S64.5 72 63.5 58l-6-10 8.5-5Z" fill="url(#mask)" stroke="#ffd991" stroke-width="3" stroke-linejoin="round"/>
  <path d="M64 48c9-7 34-7 43 0l-3 12c-5 2-9 3-18.5 3S72 62 67 60l-3-12Z" fill="#17223f"/>
  <ellipse cx="75" cy="54" rx="5.5" ry="3.8" fill="#f5f7ff"/>
  <ellipse cx="96" cy="54" rx="5.5" ry="3.8" fill="#f5f7ff"/>
  <circle cx="76" cy="54" r="1.9" fill="#182444"/>
  <circle cx="95" cy="54" r="1.9" fill="#182444"/>
  <path d="M73 72c5 4 15 4 20 0" fill="none" stroke="#7b351f" stroke-width="3" stroke-linecap="round"/>
  <path d="M68 44l-10 5M103 44l10 5" stroke="#ffd991" stroke-width="4" stroke-linecap="round"/>

  <circle cx="108" cy="101" r="12" fill="#ef5b55" stroke="#fff0d2" stroke-width="3"/>
  <path d="M102 101h12M108 95v12" stroke="#fff7e8" stroke-width="3" stroke-linecap="round"/>
</svg>
