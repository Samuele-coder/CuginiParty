<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tris - CuginiParty</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/games.css">
</head>

<body>

    <main class="game-page">

        <div class="game-container">

            <!-- TOP BAR -->
            <div class="game-topbar">

                <a href="../index.html" class="back-button">
                    ← Torna alla Home
                </a>

            </div>

            <!-- TITOLO -->
            <header class="game-header">

                <div class="game-icon">❌⭕</div>

                <h1>Tris</h1>

                <p>
                    Sfida un amico oppure affronta il computer!
                </p>

            </header>

            <!-- GIOCO -->
            <section class="game-panel">

                <div class="tris-layout">

                    <!-- MODALITÀ -->
                    <div class="mode-selector">

                        <button
                            class="mode-button active"
                            data-mode="pvp"
                            type="button">
                            👥 2 Giocatori
                        </button>

                        <button
                            class="mode-button"
                            data-mode="ai"
                            type="button">
                            🤖 Contro Computer
                        </button>

                    </div>

                    <!-- DIFFICOLTÀ -->
                    <div
                        class="difficulty-container"
                        id="difficultyContainer">

                        <span class="difficulty-label">
                            Difficoltà:
                        </span>

                        <select
                            id="difficultySelect"
                            class="difficulty-select">

                            <option value="easy">
                                Facile
                            </option>

                            <option value="medium" selected>
                                Medio
                            </option>

                            <option value="hard">
                                Difficile
                            </option>

                        </select>

                    </div>

                    <!-- TURNO -->
                    <div
                        class="turn-display"
                        id="turnDisplay">
                        Turno di ❌
                    </div>

                    <!-- TABELLONE -->
                    <div
                        class="tris-board"
                        id="trisBoard"
                        aria-label="Tabellone del Tris">

                        <button
                            class="tris-cell"
                            data-index="0"
                            type="button"
                            aria-label="Casella 1">
                        </button>

                        <button
                            class="tris-cell"
                            data-index="1"
                            type="button"
                            aria-label="Casella 2">
                        </button>

                        <button
                            class="tris-cell"
                            data-index="2"
                            type="button"
                            aria-label="Casella 3">
                        </button>

                        <button
                            class="tris-cell"
                            data-index="3"
                            type="button"
                            aria-label="Casella 4">
                        </button>

                        <button
                            class="tris-cell"
                            data-index="4"
                            type="button"
                            aria-label="Casella 5">
                        </button>

                        <button
                            class="tris-cell"
                            data-index="5"
                            type="button"
                            aria-label="Casella 6">
                        </button>

                        <button
                            class="tris-cell"
                            data-index="6"
                            type="button"
                            aria-label="Casella 7">
                        </button>

                        <button
                            class="tris-cell"
                            data-index="7"
                            type="button"
                            aria-label="Casella 8">
                        </button>

                        <button
                            class="tris-cell"
                            data-index="8"
                            type="button"
                            aria-label="Casella 9">
                        </button>

                    </div>

                    <!-- RISULTATO -->
                    <div
                        class="result-message"
                        id="resultMessage">
                    </div>

                    <!-- PUNTEGGIO -->
                    <div class="scoreboard">

                        <div class="score-box">

                            <span class="score-label">
                                ❌ X
                            </span>

                            <span
                                class="score-value"
                                id="scoreX">
                                0
                            </span>

                        </div>

                        <div class="score-box">

                            <span class="score-label">
                                Pareggi
                            </span>

                            <span
                                class="score-value"
                                id="scoreDraws">
                                0
                            </span>

                        </div>

                        <div class="score-box">

                            <span class="score-label">
                                ⭕ O
                            </span>

                            <span
                                class="score-value"
                                id="scoreO">
                                0
                            </span>

                        </div>

                    </div>

                    <!-- AZIONI -->
                    <div class="game-actions">

                        <button
                            class="game-button"
                            id="restartButton"
                            type="button">
                            🔄 Nuova partita
                        </button>

                        <button
                            class="game-button secondary"
                            id="resetScoreButton"
                            type="button">
                            🗑️ Azzera punteggio
                        </button>

                    </div>

                </div>

            </section>

        </div>

    </main>

    <script src="../js/app.js"></script>
    <script src="../js/tris.js"></script>

</body>

</html>
