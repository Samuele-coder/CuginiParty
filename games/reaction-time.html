<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2979ff">
    <title>Reaction Time - CuginiParty</title>
    <meta name="description" content="Misura il tuo tempo di reazione con cinque tentativi.">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/games.css">
    <link rel="stylesheet" href="../css/reaction-time.css">
</head>
<body>
    <main class="game-page reaction-page">
        <div class="game-container reaction-container">
            <div class="game-topbar">
                <a href="../index.html" class="back-button">← Torna alla Home</a>
                <span class="reaction-top-label">5 TENTATIVI</span>
            </div>
            <header class="game-header reaction-header">
                <div class="game-icon reaction-heading-icon" aria-hidden="true">⚡</div>
                <h1>Reaction Time</h1>
                <p>Premi nell'istante esatto in cui compare CLICCA!</p>
            </header>
            <section class="game-panel reaction-panel" aria-label="Gioco Reaction Time">
                <button type="button" id="reactionArena" class="reaction-arena ready" aria-live="polite">
                    <span class="reaction-arena-kicker" id="reactionKicker">PRONTO?</span>
                    <strong id="reactionTitle">Clicca per iniziare</strong>
                    <span id="reactionDescription">La sessione richiede 5 tempi validi.</span>
                </button>
                <div class="reaction-session-line"><span id="reactionAttemptLabel">Tentativo 1 di 5</span><span id="reactionLastResult">—</span></div>
                <div class="reaction-results" aria-label="Risultati della sessione">
                    <div class="reaction-result-card"><span>MIGLIORE</span><strong id="reactionBest">—</strong></div>
                    <div class="reaction-result-card"><span>PEGGIORE</span><strong id="reactionWorst">—</strong></div>
                    <div class="reaction-result-card"><span>MEDIA</span><strong id="reactionAverage">—</strong></div>
                </div>
                <div class="reaction-attempts" id="reactionAttempts" aria-label="Tempi dei tentativi"></div>
                <div class="reaction-actions game-actions">
                    <button type="button" class="game-button" id="reactionRestart">Nuova sessione</button>
                </div>
                <p class="reaction-record">Record personale: <strong id="reactionRecord">—</strong></p>
            </section>
        </div>
    </main>
    <script src="../js/app.js?build=game-control-final-2"></script>
    <script src="../js/reaction-time.js"></script>
</body>
</html>
