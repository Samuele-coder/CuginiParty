<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2979ff">
    <title>Sliding Puzzle - CuginiParty</title>
    <meta name="description" content="Ricostruisci l'immagine della casa con il puzzle a tessere scorrevoli.">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/games.css">
    <link rel="stylesheet" href="../css/sliding-puzzle.css">
</head>
<body>
    <main class="game-page sliding-page">
        <div class="game-container sliding-container">
            <div class="game-topbar">
                <a href="../index.html" class="back-button">← Torna alla Home</a>
                <span class="sliding-top-label">PUZZLE RISOLVIBILE</span>
            </div>
            <header class="game-header sliding-header">
                <div class="game-icon sliding-heading-icon" aria-hidden="true">▦</div>
                <h1>Sliding Puzzle</h1>
                <p>Sposta una tessera alla volta e ricostruisci l'immagine della casa.</p>
            </header>
            <section class="game-panel sliding-panel" aria-label="Partita Sliding Puzzle">
                <div class="sliding-difficulties" role="group" aria-label="Difficoltà">
                    <button type="button" data-size="3" class="active">3×3 <small>Facile</small></button>
                    <button type="button" data-size="4">4×4 <small>Normale</small></button>
                    <button type="button" data-size="5">5×5 <small>Difficile</small></button>
                </div>
                <div class="sliding-toolbar"><div><span>MOSSE</span><strong id="slidingMoves">0</strong></div><div><span>TEMPO</span><strong id="slidingTime">00:00</strong></div><div><span>BEST MOSSE</span><strong id="slidingBest">—</strong></div></div>
                <div id="slidingBoard" class="sliding-board" role="grid" aria-label="Puzzle illustrato 3 per 3"></div>
                <p id="slidingMessage" class="sliding-message" role="status" aria-live="polite">Riordina tutte le tessere.</p>
                <div class="game-actions"><button type="button" class="game-button" id="slidingNew">Nuova partita</button></div>
                <p class="sliding-tip">Ogni tessera mostra il frammento dell'immagine e il suo numero. Il puzzle viene mescolato con mosse valide.</p>
            </section>
        </div>
    </main>
    <script src="../js/app.js?build=game-control-final-2"></script>
    <script src="../js/sliding-puzzle.js"></script>
</body>
</html>
